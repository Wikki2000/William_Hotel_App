<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Daily Sales Record</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore our room services and manage reservations efficiently. From deluxe to standard rooms, ensure a pleasant stay with complementary breakfast and top-notch amenities."
      />

    <!-- Link Hotel Icon -->
    <link rel="icon" type="image/x-icon" href="/static/images/public/hotel_logo.png" />

    <!-- Link Font-Is-Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Link Staff_dashboard CSS Files-->
    <link rel="stylesheet" type="text/css" href="/static/css/dashboard/sales_details.css?{{ cache_id }}" />

    <!-- Link Staff_dashboard JS Files-->
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>

    <script type="module" defer src="/static/js/dashboard/common.js?v={{ cache_id }}"></script>
    <script type="module" defer src="/static/js/dashboard/constant.js?v={{ cache_id }}"></script>

    <script type="module" defer src="/static/js/dashboard/inventory/sales_details.js?{{ cache_id }}"></script>
  </head>
  <body>
    <div class="sales-container">
      <!-- This section dynamically loaded -->
      <h1 id="sales__record-title"></h1>
      <div class="search-bar-wrapper">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="salesSearchInput" placeholder="Search sales..." />
      </div>
      <div class="subtitle">
        <p><strong>Date: </strong> <i id="sales__record-date"></i></p>
        <p><strong>Amount: </strong> <i>Unit Price (&#8358;) &times; Qty Sold (pcs)</i></p>
      </div>

      <div id="game__laundry-salesContainer">
        <table class="custom-table">
          <thead>
            <tr>
              <th>S/N</th>
              <th>Purchase Items</th>
              <th>Unit Price (&#8358;)</th>
              <th>Quantity</th>
              <th>Amount (&#8358;)</th>
            </tr>
          </thead>
          <tbody class="sales-table-body">
            <!-- Rows will be dynamically added here -->
          </tbody>
        </table>
      </div>

      <div id="food__drink-salesContainer">
        <table class="custom-table">
          <thead>
            <tr>
              <th>S/N</th>
              <th>Purchase Items</th>
              <th>Unit Price (&#8358;)</th>
              <th>Quantity (Stock)</th>
              <th>Quantity (Sold)</th>
              <th>Quantity (Remaining)</th>
              <th>Amount (&#8358;)</th>
            </tr>
          </thead>
          <tbody class="drink__food-salesTable-body">
            <!-- Rows will be dynamically added here -->
          </tbody>
        </table>
      </div>

    </div>
  </body>
</html>
