<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confirm Guest Booking</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 400px;
      margin: 40px auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      padding: 24px;
    }
    .logo {
      display: block;
      margin: 0 auto;
      height: 60px;
    }
    h2, h4 {
      text-align: center;
      margin: 12px 0;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 16px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }
    input[readonly] {
      background-color: #f1f1f1;
      color: #333;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 24px;
      background-color: #fd7e14;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #e76c0b;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/static/logo.png" alt="Hotel Logo" class="logo" />
    <h2>Williams Court Hotel & Suites</h2>
    <h4>Guest Booking Details</h4>

    <!-- Pre-filled Booking Info -->
    <label>Room Type</label>
    <input type="text" value="Deluxe – ₦22,500" readonly>

    <label>Number of Rooms</label>
    <input type="text" value="1" readonly>

    <label>Total Price</label>
    <input type="text" value="₦22,500" readonly>

    <!-- Guest Details -->
    <label for="guestName">Name *</label>
    <input type="text" id="guestName" placeholder="e.g., James John" required>

    <label for="guestPhone">Phone No. *</label>
    <input type="tel" id="guestPhone" placeholder="e.g., 08187643578" required>

    <label for="guestAddress">Address *</label>
    <input type="text" id="guestAddress" placeholder="e.g., No. Ado Rd, Ikere-Ekiti" required>

    <label for="gender">Gender *</label>
    <select id="gender" required>
      <option value="">Select</option>
      <option>Male</option>
      <option>Female</option>
    </select>

    <label for="guestNo">Guest No. *</label>
    <input type="text" id="guestNo" placeholder="e.g., 1 male, 1 female" required>

    <label for="idType">ID Type</label>
    <select id="idType">
      <option value="">Select</option>
      <option>National ID</option>
      <option>Voter's Card</option>
      <option>Driver's License</option>
      <option>International Passport</option>
    </select>

    <label for="idNumber">ID Number</label>
    <input type="text" id="idNumber" placeholder="e.g., 1234-4u765-8767tfer-hg64w">

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="e.g., john@gmail.com">

    <!-- Book Button -->
    <button onclick="submitBooking()">Proceed to Book</button>
  </div>

  <script>
    function submitBooking() {
      alert("Booking submitted (demo only). You can hook this to backend.");
    }
  </script>
</body>
</html>
