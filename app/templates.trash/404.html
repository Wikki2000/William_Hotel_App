<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>404 - Page Not Found | Wiventory - Smart Business Platform</title>
    <link rel="icon" type="image/x-icon" href="/static/images/public/hotel_logo.png" />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", sans-serif;
        background-color: #fff8f0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        text-align: center;
      }

    .container {
      max-width: 800px;
      padding: 20px;
      display: flex;
    }

    h1 {
      font-size: 6rem;
      margin: 0;
      color: #1c1c1c;
    }

    h2 {
      font-size: 2rem;
      margin: 10px 0;
      color: #555;
    }

    p {
      font-size: 1.1rem;
      color: #777;
    }

    .btn {
      display: inline-block;
      margin-top: 30px;
      background-color: #ff6f00;
      color: white;
      padding: 14px 30px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      text-decoration: none;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background-color: #e55c00;
    }

    .image {
      margin-top: 40px;
      display: flex;
      justify-content: center;
    }
    .right-side {
      background: orange;
      margin-left: 25px;
    }

    .right-side, .logo {
      border-top-left-radius: 5px;
      border-top-right-radius: 5px;
    }

    .image img {
      max-width: 100%;
    }

    @media screen and (max-width: 600px) {
      h1 {
        font-size: 4rem;
      }
      .image img {
        max-width: 250px;
      }
    }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="left-side">

        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you are looking for does not exist.</p>
	<a href="{{ url_for('app_views.login') }}" class="btn">Go to Homepage</a>
      </div>

      <div class="image right-side">
        <img class="logo" height=100 src="{{ url_for('static', filename='images/public/hotel_logo.png') }}" alt="Wiventory Logo" />
      </div>
    </div>

  </body>
</html>
