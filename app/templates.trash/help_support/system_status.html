<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>System Status - WIS Grader</title>
  <link rel="icon" type="image/x-icon" href="/static/images/wisgrader_logo.jpeg" />
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-color: #fffdfb;
      color: #333;
    }

    .status-container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      text-align: center;
      color: #e67e22;
      margin-bottom: 30px;
    }

    .back-arrow {
      display: inline-block;
      margin-bottom: 20px;
      font-size: 18px;
      color: #e67e22;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.3s;
    }

    .back-arrow:hover {
      color: #c56e00;
    }

    .status-card {
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      text-align: center;
      margin-bottom: 20px;
    }

    .status-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    .status-message {
      font-size: 20px;
      font-weight: 500;
      color: #333;
    }

    .last-checked {
      margin-top: 10px;
      font-size: 14px;
      color: #888;
    }

    .operational .status-icon {
      color: #4CAF50;
    }

    .downtime {
      display: none;
      .status-icon {
        color: #F44336;
      }
    }

  </style>
</head>
<body>

  <section class="status-container">
    <!-- Back Arrow -->
    <a href="javascript:history.back()" class="back-arrow">← Back</a>

    <h1>System Status</h1>

    <!-- System Status Card: Operational -->
    <div class="status-card operational">
      <div class="status-icon">✅</div>
      <div class="status-message">All systems are operational.</div>
      <div class="last-checked">Last checked: <span id="lastCheckedTimeOperational"></span></div>
    </div>

    <!-- System Status Card: Downtime -->
    <div class="status-card downtime">
      <div class="status-icon">❌</div>
      <div class="status-message">System is currently down.</div>
      <div class="last-checked">Last checked: <span id="lastCheckedTimeDowntime"></span></div>
    </div>
  </section>

  <script>
	  // Calculate yesterday's date
	  const yesterday = new Date();
yesterday.setDate(yesterday.getDate() - 1);

// Format options
const options = {
	    weekday: 'short',
	    year: 'numeric',
	    month: 'short',
	    day: 'numeric',
	    hour: '2-digit',
	    minute: '2-digit'
};

// Format and display "Yesterday"
document.getElementById('lastCheckedTimeOperational').textContent = "Yesterday, " + yesterday.toLocaleString(undefined, options);
document.getElementById('lastCheckedTimeDowntime').textContent = "Yesterday, " + yesterday.toLocaleString(undefined, options);

  </script>

</body>
</html>
