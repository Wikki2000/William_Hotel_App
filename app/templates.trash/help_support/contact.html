<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Contact Us - Wiventory</title>
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script type="module" src="/static/js/dashboard/contact_feedback_message.js"></script>
    <link rel="icon" type="image/x-icon" href="/static/images/public/hotel_logo.png" />
    <style>
body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: #fffdfb; color: #333; }

    .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }

    .back-link { color: #e67e22; text-decoration: none; font-size: 16px;
      display: inline-block; margin-bottom: 20px; }

  h1 { font-size: 32px; color: #e67e22; margin-bottom: 30px; text-align:
    center; }

.contact-box { background-color: #fff; padding: 30px; border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05); max-width: 700px; margin: 0
    auto; }

    .contact-box input, .contact-box textarea { width: 100%; padding: 12px;
      margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px;
      font-size: 16px; box-sizing: border-box; transition: border-color
        0.3s; }

  .contact-box input:focus, .contact-box textarea:focus { border-color:
    #e67e22; outline: none; }

.contact-box button { background-color: #e67e22; color: white; font-size:
  16px; padding: 12px 25px; border: none; border-radius: 5px; cursor:
pointer; transition: background-color 0.3s; }

    .contact-box button:hover { background-color: #c56e00; }

    .thank-you-message { margin-top: 30px; text-align: center; font-size: 18px;
      color: #4CAF50; }

  .contact-info { margin-top: 40px; text-align: center; color: #777;
    font-size: 15px; } </style> </head> <body>

    <div class="container">
      <a href="javascript:history.back()" class="back-link">&larr; Back</a>
      <h1>Contact Us</h1>
      <div class="contact-box"> 
        <form id="contactForm">
          <textarea name="message" placeholder="Your Message" rows="6" required>
          </textarea>
          <button type="submit">Send Message</button>
        </form>
      </div>

      <div class="thank-you-message" id="thankYouMessage" style="display: none;">
        Your message has been sent! We will get back to you shortly.
      </div>

      <div class="contact-info"> For urgent inquiries, please email
        <a href="mailto:support@wiventory.com" style="color:#e67e22;">support@wiventory.com</a>
      </div>
    </div>

    <script> document.getElementById('contactForm').addEventListener('submit',
      function(event) { event.preventDefault();
        document.querySelector('.contact-box').style.display =
          'none';
        document.getElementById('thankYouMessage').style.display =
          'block';
      });
    </script>
  </body>
</html>
