      <!-- Login CSS with cache busting -->

      <!-- jQuery CDN (no change needed) -->
      <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>

      <!-- Login JS with cache busting -->
      <script type="module" src="{{ url_for('static', filename='js/auth/login.js') }}?v={{ cache_id }}"></script>

      <!-- Favicon -->
      <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/public/hotel_logo.png') }}">
      <title>Login | Wiventory - Smart Business Platform</title>

  <body>
    <main>
      <div class="login-section">
        <div class="login-content">
          <div class="login-inner-box">
            <div>
              <h1>Welcome Back!</h1>
              <p>Please enter your details</p>
            </div>

            <form id="login-form">
              <div id="error-box" class="error-box">
                <p>Invalid Login Credentials</p>
              </div>
              <input id="email_or_username" placeholder="Username or Email Address" required />
              <br>
              <!--<input type="text" id="hotel_id" required placeholder="Hotel ID" />
                <br>-->
                <input type="password" id="password" placeholder="Password" required />
                <br>

                <a href="{{ url_for('app_views.forgot_pwd') }}">Forget Password?</a>
                <br>

                <button id="signin-btn" type="submit">Login</button>
                <div class="loader"></div>
            </form>
          </div>
        </div>
      </div>
      <div class="login-design">
        <div class="logo">
          <img src="{{ url_for('static', filename='images/public/hotel_logo.png') }}" alt="Hotel Logo">
        </div>
