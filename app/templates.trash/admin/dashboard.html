<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Dashboard | Wiventory - Smart Business Platform</title>
    <link rel="icon" type="image/x-icon" href="/static/images/public/hotel_logo.png" />
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script type="module" src="/static/js/dashboard/admin/main.js"></script>
    <script type="module" src="/static/js/dashboard/admin/logout.js"></script>
    <script type="module" src="/static/js/dashboard/admin/action_on_many.js"></script>
    <script type="module" src="/static/js/dashboard/admin/send_mail.js"></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/dashboard/admin/dashboard.css') }}?v={{ cache_id }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/public/filter_by.css') }}?v={{ cache_id }}">
  </head>
  <body>
    <header>
      <p>Wiventory Admin Dashboard</p>

      <div id="search__container" class="search__container">

        <div class="search-wrapper">
          <i id="search__icon" class="fa fa-search search-icon"></i>
          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="Search..."
            />
        </div>
        <button id="filter__button" class="filter-button">
          <i class="fas fa-filter"></i>
        </button>
      </div>
      <div class="profile-menu">
        <img src="/static/images/public/hotel_logo.png" alt="Wiventory Logo" class="profile-img" onclick="toggleProfileDropdown()" />
        <div class="profile-dropdown" id="profileDropdown">
          <a href="#">Update Password</a>
          <a id="logout" href="#">Logout</a>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="action__button">
        <button id="add_new-hotel">+ Add New Business</button>
        <div class="action__button-child">
          <button>Send Mail</button>
          <button>Activate</button>
          <button>De-activate</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th style="padding-left: 50px;">Business Name & Type</th>
            <th>Subscribe On</th>
            <th>Expire On</th>
            <th>Days Count</th>
	    <th>User Mode</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="hotels__table-body">
        </tbody>
      </table>
    </div>

  <script>
    function closeFilter() {
      $("#sendEmailOption").hide();
    }
  </script>

    <div class="filter-modal" id="sendEmailOption">
      <div class="filter-content">
        <span class="close-filter" onclick="closeFilter()">×</span>
        <h3>Email Options</h3>
        <label class="student result">
          Email Options:
          <select name="email" required>
            <option value="" selected disabled>-- Select Email Option --</option>
            <option value="trial">Free Trial Reminder</option>
            <option value="subscribe">Subscription Reminder</option>
          </select>
        </label>
        <div class="filter-actions">
          <button id="filer__reset-btn" class="reset-btn">Reset</button>
          <button id="filer__apply-btn" class="apply-btn">Continue</button>
        </div>
      </div>
    </div>

    <div class="footer">
      &copy; <span id="year"></span> Wiventory. All rights reserved.
    </div>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

function toggleDropdown(icon) {
  // Close any open dropdown
  document.querySelectorAll(".dropdown").forEach(drop => drop.style.display = "none");

  const dropdown = icon.nextElementSibling;
  dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
}

function toggleProfileDropdown() {
  const dropdown = document.getElementById("profileDropdown");
  dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
}

// Close dropdowns on outside click
document.addEventListener("click", function (e) {
  if (!e.target.matches(".action-icon")) {
    document.querySelectorAll(".dropdown").forEach(drop => drop.style.display = "none");
  }
  if (!e.target.matches(".profile-img")) {
    document.getElementById("profileDropdown").style.display = "none";
  }
});
    </script>

  </body>
</html>
